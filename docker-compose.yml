services:
  db:
    image: postgres:16-alpine
    container_name: ya-gorod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: yagorod
      POSTGRES_PASSWORD: yagorod_secret
      POSTGRES_DB: yagorod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yagorod -d yagorod"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ya-gorod-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://yagorod:yagorod_secret@db:5432/yagorod
      TG_CHANNELS: afisha_noyabrsk,yanao_official,noyabrsk_info,mig_noyabrsk
      PARSE_INTERVAL_SECONDS: '300'
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media

  ya-gorod-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ya-gorod-app
    restart: unless-stopped
    ports:
      - "8088:80"

volumes:
  pgdata:
  media_data:
